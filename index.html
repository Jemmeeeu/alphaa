<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат с Ox-Alpha</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #14141c;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            border: 1px solid #2a2a3a;
        }
        .header {
            padding: 20px 24px;
            border-bottom: 1px solid #2a2a3a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 600;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .status {
            font-size: 12px;
            color: #22c55e;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .chat {
            padding: 20px 24px;
            height: 400px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .chat::-webkit-scrollbar { width: 6px; }
        .chat::-webkit-scrollbar-track { background: #1a1a2a; border-radius: 3px; }
        .chat::-webkit-scrollbar-thumb { background: #3a3a5a; border-radius: 3px; }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
        }
        .message.assistant {
            align-self: flex-start;
            background: #1e1e2e;
            border: 1px solid #2a2a3a;
        }
        .message .label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8888aa;
            margin-bottom: 4px;
        }
        .message.user .label { color: rgba(255,255,255,0.6); }
        .message .content { line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
        .input-area {
            padding: 16px 24px 24px;
            border-top: 1px solid #2a2a3a;
            display: flex;
            gap: 12px;
        }
        .input-area textarea {
            flex: 1;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #2a2a3a;
            background: #1a1a2a;
            color: #e0e0e0;
            font-size: 14px;
            resize: none;
            min-height: 52px;
            max-height: 120px;
            font-family: inherit;
        }
        .input-area textarea:focus {
            outline: none;
            border-color: #6366f1;
        }
        .input-area textarea::placeholder { color: #555577; }
        .input-area button {
            padding: 0 24px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            transition: transform 0.15s;
        }
        .input-area button:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 4px 20px rgba(99,102,241,0.3);
        }
        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .token-info {
            font-size: 11px;
            color: #555577;
            padding: 0 24px 16px;
            text-align: right;
        }
        .error-msg {
            color: #ef4444;
            font-size: 13px;
            padding: 12px 24px;
            background: rgba(239,68,68,0.1);
            border-top: 1px solid rgba(239,68,68,0.2);
            display: none;
            white-space: pre-wrap;
        }
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 600px) {
            .chat { height: 300px; padding: 16px; }
            .input-area { padding: 12px 16px 16px; flex-direction: column; }
            .input-area button { padding: 12px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧠 Ox-Alpha</h1>
            <span class="status">Online</span>
        </div>

        <div class="chat" id="chat"></div>
        <div class="error-msg" id="errorMsg"></div>

        <div class="input-area">
            <textarea id="userInput" rows="1" placeholder="Напишите сообщение..."></textarea>
            <button id="sendBtn">Отправить</button>
        </div>
        <div class="token-info" id="tokenInfo">⚡ Введите сообщение</div>
    </div>

    <script>
        // 🔑 ЗАМЕНИТЕ НА ВАШ НОВЫЙ API КЛЮЧ
        const API_KEY = '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';
        
        // Используем рабочий прокси
        const PROXY_URL = 'https://api.allorigins.win/raw?url=';
        const API_URL = 'https://openrouter.ai/api/v1/chat/completions';

        const chatContainer = document.getElementById('chat');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const tokenInfo = document.getElementById('tokenInfo');
        const errorMsg = document.getElementById('errorMsg');

        let isLoading = false;

        // Добавляем приветственное сообщение
        window.addEventListener('DOMContentLoaded', () => {
            appendMessage('assistant', '👋 Привет! Я Ox-Alpha. Задайте мне вопрос!');
        });

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        userInput.addEventListener('input', () => {
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
        });

        sendBtn.addEventListener('click', sendMessage);

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text || isLoading) return;

            userInput.value = '';
            userInput.style.height = 'auto';
            isLoading = true;
            sendBtn.disabled = true;
            sendBtn.innerHTML = '<span class="loading-spinner"></span>';
            tokenInfo.textContent = '⏳ Ожидание ответа...';
            errorMsg.style.display = 'none';
            errorMsg.textContent = '';

            appendMessage('user', text);

            try {
                // Формируем историю сообщений
                const messages = getConversationHistory();
                
                // Отправляем запрос через прокси
                const response = await fetch(`${PROXY_URL}${encodeURIComponent(API_URL)}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        model: 'stealth/ox-alpha',
                        messages: messages,
                        stream: false, // Отключаем стриминг для простоты
                    }),
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Ошибка ${response.status}: ${errorText}`);
                }

                const data = await response.json();
                
                if (data.choices && data.choices[0] && data.choices[0].message) {
                    const content = data.choices[0].message.content;
                    appendMessage('assistant', content);
                    tokenInfo.textContent = '✅ Ответ получен';
                } else {
                    throw new Error('Неверный формат ответа');
                }

            } catch (error) {
                console.error('❌ Ошибка:', error);
                errorMsg.style.display = 'block';
                errorMsg.textContent = `❌ Ошибка: ${error.message}`;
                tokenInfo.textContent = '❌ Ошибка соединения';
            } finally {
                isLoading = false;
                sendBtn.disabled = false;
                sendBtn.textContent = 'Отправить';
                userInput.focus();
            }
        }

        function appendMessage(role, content) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            
            const label = document.createElement('div');
            label.className = 'label';
            label.textContent = role === 'user' ? 'Вы' : 'Ox-Alpha';
            div.appendChild(label);
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'content';
            contentDiv.textContent = content;
            div.appendChild(contentDiv);
            
            chatContainer.appendChild(div);
            scrollToBottom();
        }

        function getConversationHistory() {
            const messages = [];
            const allMessages = chatContainer.querySelectorAll('.message');
            
            allMessages.forEach(msg => {
                const role = msg.classList.contains('user') ? 'user' : 'assistant';
                const content = msg.querySelector('.content')?.textContent || '';
                // Пропускаем приветственное сообщение для истории
                if (content && !content.startsWith('👋')) {
                    messages.push({ role, content });
                }
            });
            
            return messages;
        }

        function scrollToBottom() {
            setTimeout(() => {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 50);
        }

        console.log('🚀 Чат запущен!');
        console.log('🔑 API Key:', API_KEY ? '✅ Установлен' : '❌ Не установлен');
        console.log('🌐 Прокси:', PROXY_URL);
    </script>
</body>
</html>

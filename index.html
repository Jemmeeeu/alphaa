<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат с Ox-Alpha</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #14141c;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            border: 1px solid #2a2a3a;
        }
        .header {
            padding: 20px 24px;
            border-bottom: 1px solid #2a2a3a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 600;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .status {
            font-size: 12px;
            color: #22c55e;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .chat {
            padding: 20px 24px;
            height: 400px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .chat::-webkit-scrollbar { width: 6px; }
        .chat::-webkit-scrollbar-track { background: #1a1a2a; border-radius: 3px; }
        .chat::-webkit-scrollbar-thumb { background: #3a3a5a; border-radius: 3px; }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
        }
        .message.assistant {
            align-self: flex-start;
            background: #1e1e2e;
            border: 1px solid #2a2a3a;
        }
        .message .label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8888aa;
            margin-bottom: 4px;
        }
        .message.user .label { color: rgba(255,255,255,0.6); }
        .message .content { line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
        .input-area {
            padding: 16px 24px 24px;
            border-top: 1px solid #2a2a3a;
            display: flex;
            gap: 12px;
        }
        .input-area textarea {
            flex: 1;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #2a2a3a;
            background: #1a1a2a;
            color: #e0e0e0;
            font-size: 14px;
            resize: none;
            min-height: 52px;
            max-height: 120px;
            font-family: inherit;
        }
        .input-area textarea:focus {
            outline: none;
            border-color: #6366f1;
        }
        .input-area textarea::placeholder { color: #555577; }
        .input-area button {
            padding: 0 24px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
        }
        .input-area button:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 4px 20px rgba(99,102,241,0.3);
        }
        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .token-info {
            font-size: 11px;
            color: #555577;
            padding: 0 24px 16px;
            text-align: right;
        }
        .error-msg {
            color: #ef4444;
            font-size: 13px;
            padding: 12px 24px;
            background: rgba(239,68,68,0.1);
            border-top: 1px solid rgba(239,68,68,0.2);
            display: none;
        }
        @media (max-width: 600px) {
            .chat { height: 300px; padding: 16px; }
            .input-area { padding: 12px 16px 16px; flex-direction: column; }
            .input-area button { padding: 12px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧠 Ox-Alpha</h1>
            <span class="status">Online</span>
        </div>

        <div class="chat" id="chat"></div>
        <div class="error-msg" id="errorMsg"></div>

        <div class="input-area">
            <textarea id="userInput" rows="1" placeholder="Напишите сообщение..."></textarea>
            <button id="sendBtn">Отправить</button>
        </div>
        <div class="token-info" id="tokenInfo">⚡ Введите сообщение</div>
    </div>

    <script>
        const API_KEY = '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';

        const chatContainer = document.getElementById('chat');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const tokenInfo = document.getElementById('tokenInfo');
        const errorMsg = document.getElementById('errorMsg');

        let isLoading = false;

        // Отправка по Enter
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Авто-высота
        userInput.addEventListener('input', () => {
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
        });

        // Кнопка отправки
        sendBtn.addEventListener('click', sendMessage);

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text || isLoading) {
                console.log('❌ Пустое сообщение или уже загружено');
                return;
            }

            console.log('✅ Отправляем:', text);

            userInput.value = '';
            userInput.style.height = 'auto';
            isLoading = true;
            sendBtn.disabled = true;
            sendBtn.textContent = '⏳...';
            tokenInfo.textContent = '⏳ Ожидание ответа...';
            errorMsg.style.display = 'none';
            errorMsg.textContent = '';

            // Добавляем сообщение пользователя
            appendMessage('user', text);

            try {
                console.log('📡 Отправка запроса к OpenRouter...');
                
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`,
                    },
                    body: JSON.stringify({
                        model: 'stealth/ox-alpha',
                        messages: getConversationHistory(),
                        stream: true,
                    }),
                });

                console.log('📡 Статус ответа:', response.status);

                if (!response.ok) {
                    const errorData = await response.json();
                    console.error('❌ Ошибка API:', errorData);
                    throw new Error(errorData.error?.message || `Ошибка ${response.status}`);
                }

                // Создаём сообщение ассистента
                const assistantDiv = document.createElement('div');
                assistantDiv.className = 'message assistant';
                const label = document.createElement('div');
                label.className = 'label';
                label.textContent = 'Ox-Alpha';
                assistantDiv.appendChild(label);
                const contentDiv = document.createElement('div');
                contentDiv.className = 'content';
                contentDiv.textContent = '';
                assistantDiv.appendChild(contentDiv);
                chatContainer.appendChild(assistantDiv);
                scrollToBottom();

                // Читаем стрим
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let fullContent = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (!trimmed || !trimmed.startsWith('data: ')) continue;

                        const data = trimmed.slice(6);
                        if (data === '[DONE]') continue;

                        try {
                            const json = JSON.parse(data);
                            const delta = json.choices?.[0]?.delta;
                            
                            if (delta?.content) {
                                fullContent += delta.content;
                                contentDiv.textContent = fullContent;
                                scrollToBottom();
                            }

                            // Информация о токенах
                            if (json.usage?.completion_tokens_details?.reasoning_tokens) {
                                tokenInfo.textContent = `🧠 Reasoning: ${json.usage.completion_tokens_details.reasoning_tokens} токенов`;
                            }
                        } catch (e) {
                            console.warn('⚠️ Ошибка парсинга JSON:', e);
                        }
                    }
                }

                if (fullContent) {
                    tokenInfo.textContent = '✅ Ответ получен';
                } else {
                    contentDiv.textContent = '⚠️ Пустой ответ';
                    tokenInfo.textContent = '⚠️ Модель вернула пустой ответ';
                }

            } catch (error) {
                console.error('❌ Критическая ошибка:', error);
                errorMsg.style.display = 'block';
                errorMsg.textContent = `❌ Ошибка: ${error.message}`;
                tokenInfo.textContent = '❌ Ошибка соединения';
                
                // Удаляем пустое сообщение ассистента
                const lastMsg = chatContainer.lastElementChild;
                if (lastMsg && lastMsg.classList.contains('assistant')) {
                    lastMsg.remove();
                }
            } finally {
                isLoading = false;
                sendBtn.disabled = false;
                sendBtn.textContent = 'Отправить';
                userInput.focus();
                console.log('✅ Готово');
            }
        }

        function appendMessage(role, content) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            
            const label = document.createElement('div');
            label.className = 'label';
            label.textContent = role === 'user' ? 'Вы' : 'Ox-Alpha';
            div.appendChild(label);

            const contentDiv = document.createElement('div');
            contentDiv.className = 'content';
            contentDiv.textContent = content;
            div.appendChild(contentDiv);

            chatContainer.appendChild(div);
            scrollToBottom();
        }

        function getConversationHistory() {
            const messages = [];
            const allMessages = chatContainer.querySelectorAll('.message');
            allMessages.forEach(msg => {
                const role = msg.classList.contains('user') ? 'user' : 'assistant';
                const content = msg.querySelector('.content')?.textContent || '';
                if (content && content !== ' ' && !content.startsWith('⚠️') && !content.startsWith('❌')) {
                    messages.push({ role, content });
                }
            });
            return messages;
        }

        function scrollToBottom() {
            setTimeout(() => {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 50);
        }

        // Проверка API ключа при загрузке
        console.log('🔑 API Key установлен:', API_KEY ? '✅ Да' : '❌ Нет');
        console.log('🔑 Длина ключа:', API_KEY.length);
        console.log('💡 Убедитесь, что ключ начинается с "sk-or-v1-"');
    </script>
</body>
</html>
